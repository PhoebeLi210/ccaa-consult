# 档案整理加工记录表
# 行业: 档案整理及数字化加工服务
# 文件级别: 四级文件（记录表单）

metadata:
  industry: archive_service
  file_code: CD-QESMS-D-002
  version: "V1.0"
  effective_date: "{{effective_date}}"
  form_type: record
  
header:
  company_name: "{{company_name}}"
  title: "档案整理加工记录表"
  subtitle: "Archive Arrangement Processing Record"
  
content:
  basic_info:
    title: "基本信息"
    fields:
      - name: "记录日期"
        type: date
        required: true
      - name: "项目名称"
        type: text
        required: true
      - name: "客户名称"
        type: text
        required: true
      - name: "整理人员"
        type: text
        required: true
      - name: "质检人员"
        type: text
        required: true
        
  processing_content:
    title: "加工内容"
    table:
      headers: ["序号", "档号", "题名", "整理内容", "数量", "质量状况", "备注"]
      rows: 15
      
  quality_check:
    title: "质量检查"
    fields:
      - name: "检查项目"
        type: checkbox
        options:
          - "分类准确"
          - "编目规范"
          - "装订整齐"
          - "标识清晰"
          - "完整无损"
      - name: "检查结果"
        type: select
        options: ["合格", "不合格"]
        required: true
      - name: "不合格说明"
        type: textarea
        required: false
      - name: "整改情况"
        type: textarea
        required: false
        
  confirmation:
    title: "确认签字"
    fields:
      - name: "整理人签字"
        type: signature
        required: true
      - name: "质检员签字"
        type: signature
        required: true
      - name: "日期"
        type: date
        required: true
        
  notes:
    title: "填表说明"
    text: |
      1. 本表用于记录档案整理加工过程。
      2. 整理内容应详细记录具体工作内容。
      3. 质量检查应按检查项目逐项检查。
      4. 不合格项应及时整改并记录整改情况。
