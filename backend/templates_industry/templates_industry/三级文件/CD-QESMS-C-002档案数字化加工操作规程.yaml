# 档案数字化加工操作规程
# 行业: 档案整理及数字化加工服务
# 文件级别: 三级文件（作业指导书/管理制度）

metadata:
  industry: archive_service
  file_code: CD-QESMS-C-002
  version: "V1.0"
  effective_date: "{{effective_date}}"
  department: "{{department_name}}"
  
header:
  company_name: "{{company_name}}"
  title: "档案数字化加工操作规程"
  subtitle: "Archive Digitization Operation Procedure"
  
content:
  purpose:
    title: "1. 目的"
    text: |
      为规范档案数字化加工流程，确保数字化成果质量，提高加工效率，保障档案安全，特制定本规程。
      
  scope:
    title: "2. 适用范围"
    text: |
      本规程适用于{{company_name}}所有档案数字化加工项目，包括：
      a) 纸质档案扫描数字化
      b) 照片档案数字化
      c) 图纸档案数字化
      d) 缩微胶片数字化
      e) 其他载体档案数字化
      
  responsibilities:
    title: "3. 职责"
    text: |
      3.1 项目经理
      - 负责数字化项目的整体规划和管理
      - 负责制定数字化加工方案
      - 负责协调项目资源和进度
      
      3.2 数字化加工人员
      - 按照本规程进行数字化加工操作
      - 确保数字化成果质量
      - 负责设备的日常维护
      
      3.3 数据质检人员
      - 对数字化成果进行质量检查
      - 记录质量问题，提出整改要求
      - 确认数据整改完成情况
      
      3.4 系统管理员
      - 负责数字化系统的维护管理
      - 负责数据备份和安全管理
      - 负责用户权限管理
      
  operation_process:
    title: "4. 加工流程"
    text: |
      4.1 档案出库
      4.1.1 根据数字化任务清单办理档案出库手续
      4.1.2 核对档案数量和状态
      4.1.3 做好档案保护措施
      
      4.2 档案预处理
      4.2.1 拆除档案装订物（如需）
      4.2.2 平整档案页面
      4.2.3 清理档案污渍（在可处理范围内）
      4.2.4 编制页码（如需要）
      
      4.3 档案扫描
      4.3.1 根据档案类型选择合适的扫描参数
      4.3.2 按照《纸质档案数字化规范》（DA/T 31）进行扫描
      4.3.3 确保图像清晰、完整、不偏斜
      4.3.4 及时处理扫描异常情况
      
      4.4 图像处理
      4.4.1 对扫描图像进行纠偏、去污处理
      4.4.2 调整图像亮度、对比度
      4.4.3 进行图像裁边处理
      4.4.4 确保图像质量符合标准要求
      
      4.5 数据质检
      4.5.1 对数字化成果进行100%质检
      4.5.2 检查图像清晰度、完整性
      4.5.3 检查数据挂接准确性
      4.5.4 不合格数据返回重新加工
      
      4.6 档案还原
      4.6.1 按照原状恢复档案装订
      4.6.2 检查档案完整性
      4.6.3 办理档案归还手续
      
      4.7 数据移交
      4.7.1 整理数字化成果数据
      4.7.2 进行数据备份
      4.7.3 向客户移交数据
      4.7.4 办理数据移交手续
      
  technical_requirements:
    title: "5. 技术要求"
    text: |
      5.1 扫描参数
      - 分辨率：一般档案≥200dpi，重要档案≥300dpi
      - 色彩模式：黑白文档采用黑白或灰度，彩色文档采用彩色
      - 存储格式：TIFF或JPEG，长期保存推荐TIFF
      
      5.2 图像质量
      - 图像清晰，文字可辨
      - 页面完整，无缺失
      - 无明显噪点、污渍
      - 偏斜度≤1度
      
      5.3 数据挂接
      - 建立档号与图像的对应关系
      - 确保数据挂接准确无误
      - 建立目录数据库
      
  quality_control:
    title: "6. 质量控制"
    text: |
      6.1 自检：加工人员完成自检，合格率≥95%
      6.2 抽检：质检人员按10%比例抽检，合格率≥98%
      6.3 全检：重要档案进行100%质量检查
      6.4 整改：不合格数据必须返工，直至合格
      
  safety_requirements:
    title: "7. 安全要求"
    text: |
      7.1 档案安全
      - 轻拿轻放，避免损坏档案
      - 保持工作环境整洁
      - 做好档案防虫、防潮、防火措施
      
      7.2 数据安全
      - 定期进行数据备份
      - 做好病毒防护
      - 控制数据访问权限
      - 禁止私自复制、外传数据
      
      7.3 设备安全
      - 正确操作扫描设备
      - 定期维护保养设备
      - 发现故障及时报修
      
  records:
    title: "8. 相关记录"
    text: |
      8.1 《档案接收登记表》（CD-QESMS-D-001）
      8.2 《档案数字化加工记录表》（CD-QESMS-D-003）
      8.3 《档案质量检查记录表》（CD-QESMS-D-004）
