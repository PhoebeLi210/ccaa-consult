# 档案整理服务规范
# 行业: 档案整理及数字化加工服务
# 文件级别: 三级文件（作业指导书/管理制度）

metadata:
  industry: archive_service
  file_code: CD-QESMS-C-001
  version: "V1.0"
  effective_date: "{{effective_date}}"
  department: "{{department_name}}"
  
header:
  company_name: "{{company_name}}"
  title: "档案整理服务规范"
  subtitle: "Archive Arrangement Service Specification"
  
content:
  purpose:
    title: "1. 目的"
    text: |
      为规范档案整理服务流程，确保档案整理质量，提高服务效率，满足客户需求，特制定本规范。
      
  scope:
    title: "2. 适用范围"
    text: |
      本规范适用于{{company_name}}所有档案整理服务项目，包括：
      a) 文书档案整理
      b) 科技档案整理
      c) 会计档案整理
      d) 人事档案整理
      e) 其他各类专业档案整理
      
  responsibilities:
    title: "3. 职责"
    text: |
      3.1 项目经理
      - 负责档案整理项目的整体协调和管理
      - 负责与客户沟通，确认服务需求
      - 负责项目进度跟踪和质量控制
      
      3.2 档案整理人员
      - 按照本规范执行档案整理工作
      - 确保整理质量符合标准要求
      - 及时报告工作中发现的问题
      
      3.3 质量检查人员
      - 对档案整理成果进行质量检查
      - 记录检查结果，提出整改意见
      - 确认整改完成情况
      
  service_process:
    title: "4. 服务流程"
    text: |
      4.1 档案接收
      4.1.1 与客户办理档案交接手续，填写《档案接收登记表》
      4.1.2 清点档案数量，核对档案清单
      4.1.3 检查档案完整性和可整理状态
      4.1.4 对档案进行初步分类和编号
      
      4.2 档案整理
      4.2.1 按照《归档文件整理规则》（DA/T 22）进行整理
      4.2.2 对档案进行分类、排序、编目
      4.2.3 编制档号，填写备考表
      4.2.4 装订档案，确保整齐牢固
      
      4.3 质量检查
      4.3.1 整理完成后进行自检
      4.3.2 质量检查人员进行抽检
      4.3.3 对不合格项进行整改
      4.3.4 整改完成后进行复检
      
      4.4 档案移交
      4.4.1 整理完成后办理移交手续
      4.4.2 填写《档案交接登记表》
      4.4.3 请客户进行验收确认
      4.4.4 收集客户反馈意见
      
  quality_standards:
    title: "5. 质量标准"
    text: |
      5.1 分类准确：档案分类符合国家和行业标准
      5.2 编目规范：著录项目完整、准确、规范
      5.3 装订整齐：装订牢固、整齐、美观
      5.4 标识清晰：档号、页码等标识清晰可辨
      5.5 完整无损：整理过程中不得损坏档案原件
      
  safety_requirements:
    title: "6. 安全要求"
    text: |
      6.1 保密要求
      - 严格遵守档案保密规定
      - 不得泄露档案内容信息
      - 不得私自复制、拍摄档案
      
      6.2 安全操作
      - 保持工作场所整洁
      - 正确使用整理工具
      - 注意防火、防潮、防虫
      
  records:
    title: "7. 相关记录"
    text: |
      7.1 《档案接收登记表》（CD-QESMS-D-001）
      7.2 《档案整理加工记录表》（CD-QESMS-D-002）
      7.3 《档案质量检查记录表》（CD-QESMS-D-004）
      7.4 《档案交接登记表》（CD-QESMS-D-005）
      7.5 《客户验收评价表》（CD-QESMS-D-006）
      
